name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger cPanel Git Pull
    runs-on: ubuntu-latest

    steps:
      - name: Goi cPanel API de pull code moi
        run: |
          RESPONSE=$(curl -sk \
            --user "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControl/update" \
            --data-urlencode "repository=/home/${{ secrets.CPANEL_USERNAME }}/webvuakho")

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"status":1'; then
            echo "Deploy thanh cong!"
          else
            echo "Co loi, kiem tra cPanel Git Version Control"
            exit 1
          fi
