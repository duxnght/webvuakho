name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via Webhook
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Deploy Webhook
        run: |
          RESPONSE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            "https://vuakhotronsanshk.com.vn/_deploy/hook/")

          cat /tmp/resp.json
          echo ""

          if [ "$RESPONSE" = "200" ]; then
            echo "Deploy thanh cong!"
          else
            echo "That bai — HTTP $RESPONSE"
            exit 1
          fi
